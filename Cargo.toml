[package]
name = "open-editor"
version = "0.1.0"
edition = "2021"
authors = ["JereyBeni"]
description = "Lightweight video editor with Rust UI + OFX support"
license = "MIT"

[dependencies]
# UI - egui is lightweight and works well
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Logging
log = "0.4"
env_logger = "0.11"

# For later: video decoding, OFX host, etc.
# ffmpeg-next = ...
# libloading = ... (for OFX plugins)

[profile.release]
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true